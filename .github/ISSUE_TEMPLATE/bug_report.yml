name: 问题反馈
description: 米老师/同事反馈某个页面的问题（截图请脱敏）
title: "[问题] 页面 - 简述"
body:
  - type: input
    id: page
    attributes:
      label: 哪个页面
      placeholder: 例如：立项 → 项目登记表
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 软件版本、设备与浏览器
      placeholder: 例如：测试日期 / Mac / Safari版本
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 依次做了什么
      placeholder: "1. 打开……\n2. 点击……\n3. 看到了……"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 希望怎样、如何算通过
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 只允许改哪里；哪些地方不要改
      value: 只修改本问题点名范围，其他页面、布局、字段和业务规则保持原样。
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 上传前检查
      options:
        - label: 已遮住客户、财务、联系方式和章签敏感信息；没有上传真实业务原件或密码。
          required: true
