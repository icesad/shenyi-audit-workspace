name: portable-unit
on:
  push:
    branches: [main, 'work/**', 'fix/**', 'feat/**', 'docs/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check:repo
      - run: npm run test:unit
