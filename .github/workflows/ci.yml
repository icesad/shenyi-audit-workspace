name: portable-unit
on:
  push:
    branches: [main, 'work/**', 'fix/**', 'feat/**', 'docs/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  unit:
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - run: npm run check:repo
      - run: npm run test:unit
  tools:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check:repo
      - run: npm run test:tools
      - name: Install native edge smoke dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends nginx openssl
      - name: Verify real Nginx identity edge limits
        timeout-minutes: 3
        run: node scripts/check-identity-edge.mjs --include-recovery
