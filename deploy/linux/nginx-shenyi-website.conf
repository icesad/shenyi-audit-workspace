# Include in the same http context as nginx-shenyi-team.conf after site approval.
# Provision the shenji.vip certificate before enabling this virtual host.
log_format shenyi_website '$time_iso8601 $request_id $request_method $status '
                          '$body_bytes_sent $request_time';

map $status $shenyi_website_allow {
    405 "GET, HEAD";
    default "";
}

map $request_uri $shenyi_website_public_route {
    default 0;
    ~^/(styles[.]css|assets/brand-shenyi[.]png)?([?]|$) 1;
    # windows-download-route
}

server {
    listen 443 ssl;
    server_name shenji.vip;
    ssl_certificate /etc/nginx/shenyi-website/public-chain.pem;
    ssl_certificate_key /etc/nginx/shenyi-website/public-key.pem;
    access_log /var/log/nginx/shenyi-website-access.log shenyi_website;
    error_log /var/log/nginx/shenyi-website-error.log warn;

    root /srv/shenyi-website/current;
    disable_symlinks on from=$document_root;
    autoindex off;
    types {
        text/html html;
        text/css css;
        image/png png;
    }

    add_header Allow $shenyi_website_allow always;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

    if ($ssl_server_name != shenji.vip) { return 421; }
    if ($http_host != shenji.vip) { return 421; }
    # Match the original path even when nginx normalizes the location URI.
    if ($shenyi_website_public_route = 0) { return 404; }
    if ($request_method !~ "^(GET|HEAD)$") { return 405; }

    location = / { try_files /index.html =404; }
    location = /styles.css { try_files /styles.css =404; }
    location = /assets/brand-shenyi.png { try_files /assets/brand-shenyi.png =404; }
    # windows-download-location
    location / { return 404; }
}
