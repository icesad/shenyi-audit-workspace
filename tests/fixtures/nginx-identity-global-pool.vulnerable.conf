# Include from nginx.conf's http context. Replace all occurrences of the
# reserved hostname and install distinct edge and upstream TLS certificates.
log_format shenyi_team '$time_iso8601 $request_id $request_method $status '
                       '$body_bytes_sent $request_time $upstream_response_time';

# Only the small anonymous onboarding and recovery operations use these edge limits.
# Completed invalid requests do not leave a shared minute-long rejection budget:
# global protection counts in-flight requests and releases capacity on completion.
map $uri $shenyi_public_identity_ip {
    default "";
    ~^/api/auth/(?:(?:onboarding|first-administrator)/(?:preview|challenges|activate)|recovery-requests|phone/challenges)$ $binary_remote_addr;
}
map $shenyi_public_identity_ip $shenyi_public_identity_global {
    "" "";
    default $server_name;
}
limit_req_zone $shenyi_public_identity_ip zone=shenyi_identity_requests:10m rate=10r/s;
limit_conn_zone $shenyi_public_identity_ip zone=shenyi_identity_connections:10m;
limit_conn_zone $shenyi_public_identity_global zone=shenyi_identity_inflight:1m;

upstream shenyi_team_backend {
    server 127.0.0.1:9443;
}

server {
    listen 443 ssl default_server;
    server_name _;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_reject_handshake on;
    access_log off;
    return 421;
}

server {
    listen 443 ssl;
    server_name team.shenyi.example;
    ssl_certificate /etc/nginx/shenyi-team/public-chain.pem;
    ssl_certificate_key /etc/nginx/shenyi-team/public-key.pem;
    access_log /var/log/nginx/shenyi-team-access.log shenyi_team;
    error_log /var/log/nginx/shenyi-team-error.log warn;

    if ($ssl_server_name != team.shenyi.example) { return 421; }
    if ($http_host != team.shenyi.example) { return 421; }

    # Only the API leaves the loopback network. Health and readiness stay local.
    location / { return 404; }

    location ^~ /api/ {
        if ($request_uri !~ "^/api/") { return 404; }
        # Empty mapped keys leave other API routes, including large signed
        # uploads and provider callbacks, outside this small-request gate.
        limit_req zone=shenyi_identity_requests burst=20 nodelay;
        limit_req_status 429;
        limit_conn shenyi_identity_connections 4;
        limit_conn shenyi_identity_inflight 64;
        limit_conn_status 429;
        # The largest signed request is the ledger snapshot (64 MiB + 16 KiB).
        client_max_body_size 67125248;
        client_body_timeout 15s;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 190s;

        proxy_http_version 1.1;
        proxy_pass https://shenyi_team_backend;
        proxy_set_header Host team.shenyi.example;
        proxy_set_header Connection "";
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Port "";
        proxy_set_header X-Forwarded-Proto "";
        proxy_set_header X-Real-IP "";
        # Trusted login-rate-limit source: always overwrite any client-supplied value.
        proxy_set_header X-Shenyi-Client-IP $remote_addr;
        proxy_set_header X-Shenyi-Server-Id "";

        proxy_ssl_server_name on;
        proxy_ssl_name team.shenyi.example;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/nginx/shenyi-team/backend-ca.pem;
        proxy_ssl_verify_depth 2;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_ignore_headers X-Accel-Buffering X-Accel-Redirect;
        proxy_intercept_errors off;
        proxy_redirect off;
        proxy_next_upstream off;
        proxy_cache off;
        gzip off;

        location = /api/auth/wechat/callback {
            if ($request_uri !~ "^/api/auth/wechat/callback($|[?])") { return 404; }
            # Provider code and state are query values. Upstream error logs can include the request line.
            proxy_pass https://shenyi_team_backend;
            access_log off;
            error_log /dev/null;
        }
    }
}
